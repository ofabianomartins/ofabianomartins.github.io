name: Deploy Zola site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Build
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          if [[ "${repo}" == "${owner}.github.io" ]]; then
            base="https://${owner}.github.io"
          else
            base="https://${owner}.github.io/${repo}"
          fi
          echo "Using base_url=${base}"
          zola build --base-url "${base}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Announce new post (X and LinkedIn)
        continue-on-error: true
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          reponame="${{ github.event.repository.name }}"
          if [[ -n "${SITE_BASE_URL:-}" ]]; then
            base="${SITE_BASE_URL}"
          elif [[ "${reponame}" == "${owner}.github.io" ]]; then
            base="https://${owner}.github.io"
          else
            base="https://${owner}.github.io/${reponame}"
          fi
          export SITE_BASE_URL="${base}"
          export ANNOUNCE_GIT_SHA="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            export ANNOUNCE_GIT_BEFORE="${{ github.event.before }}"
          else
            export ANNOUNCE_GIT_BEFORE=""
          fi
          python3 -m pip install -q "requests" "requests-oauthlib"
          python3 .github/scripts/announce_social.py
        env:
          # Optional: full public site URL (e.g. custom domain). If unset, it matches the build step (github.io).
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET: ${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
